name: Publish Docker Image for CI

on:
  # Republish whenever the recipe itself changes, so that ci_build.yaml never
  # has to compile the image on the fly.
  push:
    branches:
      - main
      - ext/**
    paths:
      - .github/Dockerfile
      - .github/workflows/docker.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: repo checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: container registry log in
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: metadata extraction
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # A single stable tag, named after the toolchain rather than after the
        # branch: ci_build.yaml pulls it by name, and every branch that shares
        # the Dockerfile shares the image.  Keep in sync with IMAGE_TAG there.
        tags: type=raw,value=rocq-9.2

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .github/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
